<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKITA 网站管理后台</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root {
    --bg: #0f1117; --panel: #181c26; --line: #2a3040;
    --ink: #e6e9ef; --ink2: #9aa3b2; --acc: #6ee7ff; --acc2: #a78bfa;
    --ok: #4ade80; --err: #f87171; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 80px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .04em; }
  h1 small { color: var(--ink2); font-weight: 400; margin-left: 10px; }
  .topbar { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tabs button { background: none; border: 1px solid var(--line); color: var(--ink2);
    padding: 8px 18px; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .tabs button.on { border-color: var(--acc); color: var(--acc); }
  .card { background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 20px; margin-bottom: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line);
    vertical-align: top; }
  th { color: var(--ink2); font-weight: 500; white-space: nowrap; }
  tr:hover td { background: rgba(255,255,255,.02); }
  label { display: block; margin: 14px 0 4px; color: var(--ink2); font-size: 12px;
    letter-spacing: .05em; }
  input, select, textarea { width: 100%; background: #11141c; color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px;
    font: inherit; }
  textarea { min-height: 90px; resize: vertical; }
  textarea.tall { min-height: 170px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--acc); }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .btn { display: inline-block; background: linear-gradient(120deg, var(--acc), var(--acc2));
    color: #0f1117; border: 0; border-radius: 4px; padding: 9px 22px;
    font: inherit; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: none; border: 1px solid var(--line); color: var(--ink); font-weight: 400; }
  .btn.danger { background: none; border: 1px solid var(--err); color: var(--err); font-weight: 400; }
  .btn + .btn { margin-left: 10px; }
  .btn-sm { padding: 4px 12px; font-size: 12px; }
  .msg { margin: 12px 0 0; font-size: 13px; min-height: 18px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 3px; font-size: 12px; }
  .tag.pub { background: rgba(74,222,128,.12); color: var(--ok); }
  .tag.draft { background: rgba(251,191,36,.12); color: var(--warn); }
  .hint { color: var(--ink2); font-size: 12px; margin-top: 4px; }
  .hidden { display: none !important; }
  .login-box { max-width: 380px; margin: 12vh auto 0; }
  fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 18px 0 0; padding: 4px 16px 16px; }
  legend { color: var(--acc); font-size: 13px; padding: 0 8px; }
  pre.msgbody { white-space: pre-wrap; margin: 0; font: 12px/1.5 inherit; color: var(--ink2); }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== login ===== -->
  <div id="viewLogin" class="login-box hidden">
    <div class="card">
      <h1 style="margin-bottom:6px">AKITA 管理后台</h1>
      <p class="hint">仅限内部使用 · 连续失败 5 次将锁定 15 分钟</p>
      <label>用户名</label>
      <input id="loginUser" autocomplete="username">
      <label>密码</label>
      <input id="loginPass" type="password" autocomplete="current-password">
      <p class="msg err" id="loginMsg"></p>
      <button class="btn" id="btnLogin">登 录</button>
    </div>
  </div>

  <!-- ===== panel ===== -->
  <div id="viewPanel" class="hidden">
    <div class="topbar">
      <h1>AKITA 网站管理后台 <small id="whoami"></small></h1>
      <button class="btn ghost btn-sm" id="btnLogout">退出登录</button>
    </div>

    <div class="tabs">
      <button id="tabNews" class="on">新闻管理</button>
      <button id="tabEnq">询盘记录</button>
    </div>

    <!-- news list -->
    <div id="paneNews">
      <div class="card">
        <button class="btn" id="btnNewArticle">+ 新建新闻</button>
        <span class="hint" style="margin-left:12px">前台只显示「已发布」状态的新闻；排序值小的在前。</span>
      </div>
      <div class="card">
        <table>
          <thead><tr><th>ID</th><th>标题</th><th>Slug</th><th>排序</th><th>状态</th><th>更新时间</th><th></th></tr></thead>
          <tbody id="newsRows"></tbody>
        </table>
      </div>
    </div>

    <!-- news editor -->
    <div id="paneEditor" class="hidden">
      <div class="card">
        <button class="btn ghost btn-sm" id="btnBackToList">← 返回列表</button>
        <span id="editorTitle" style="margin-left:12px;color:var(--ink2)"></span>

        <div class="row" style="margin-top:10px">
          <div><label>Slug（URL 锚点，小写字母/数字/连字符）</label><input id="f_slug"></div>
          <div><label>排序（小的在前，默认 0）</label><input id="f_position" type="number" value="0"></div>
          <div><label>状态</label>
            <select id="f_status"><option value="draft">草稿</option><option value="published">已发布</option></select>
          </div>
        </div>
        <label>Meta 标签行（等宽小字，如 JIB · DORALEH MULTIPURPOSE PORT）</label>
        <input id="f_meta_label">

        <fieldset><legend>英文 EN</legend>
          <div class="row2">
            <div><label>栏目（如 Network expansion）</label><input id="f_category_en"></div>
            <div><label>副标题（可空）</label><input id="f_subtitle_en"></div>
          </div>
          <label>标题 *</label><input id="f_title_en">
          <label>正文（段落之间空一行）</label><textarea id="f_body_en" class="tall"></textarea>
        </fieldset>

        <fieldset><legend>法文 FR</legend>
          <div class="row2">
            <div><label>栏目</label><input id="f_category_fr"></div>
            <div><label>副标题</label><input id="f_subtitle_fr"></div>
          </div>
          <label>标题</label><input id="f_title_fr">
          <label>正文</label><textarea id="f_body_fr" class="tall"></textarea>
        </fieldset>

        <fieldset><legend>中文 ZH</legend>
          <div class="row2">
            <div><label>栏目</label><input id="f_category_zh"></div>
            <div><label>副标题</label><input id="f_subtitle_zh"></div>
          </div>
          <label>标题</label><input id="f_title_zh">
          <label>正文</label><textarea id="f_body_zh" class="tall"></textarea>
        </fieldset>

        <label>数据卡（可空；每行一条，竖线分隔 6 段：值EN | 值FR | 值ZH | 标签EN | 标签FR | 标签ZH）</label>
        <textarea id="f_facts" placeholder="6 | 6 | 6 | Berths at DMP | Postes à quai au DMP | DMP 泊位数"></textarea>

        <p class="msg" id="editorMsg"></p>
        <button class="btn" id="btnSave">保 存</button>
        <button class="btn danger hidden" id="btnDelete">删除本条</button>
      </div>
    </div>

    <!-- enquiries -->
    <div id="paneEnq" class="hidden">
      <div class="card">
        <table>
          <thead><tr><th>ID</th><th>类型</th><th>姓名 / 公司</th><th>联系方式</th><th>路线 / 服务 / 单号</th><th>留言</th><th>语言</th><th>邮件</th><th>时间</th></tr></thead>
          <tbody id="enqRows"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var api = function (path, opts) {
    opts = opts || {};
    opts.credentials = 'same-origin';
    if (opts.json) {
      opts.method = opts.method || 'POST';
      opts.headers = { 'Content-Type': 'application/json' };
      opts.body = JSON.stringify(opts.json);
      delete opts.json;
    }
    return fetch(path, opts).then(function (r) { return r.json(); });
  };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  var FIELDS = ['slug', 'position', 'status', 'meta_label',
    'category_en', 'category_fr', 'category_zh',
    'title_en', 'title_fr', 'title_zh',
    'subtitle_en', 'subtitle_fr', 'subtitle_zh',
    'body_en', 'body_fr', 'body_zh', 'facts'];
  var editingId = null;

  function show(view) {
    $('viewLogin').classList.toggle('hidden', view !== 'login');
    $('viewPanel').classList.toggle('hidden', view === 'login');
  }
  function pane(name) {
    $('paneNews').classList.toggle('hidden', name !== 'news');
    $('paneEditor').classList.toggle('hidden', name !== 'editor');
    $('paneEnq').classList.toggle('hidden', name !== 'enq');
    $('tabNews').classList.toggle('on', name !== 'enq');
    $('tabEnq').classList.toggle('on', name === 'enq');
  }

  /* ---- login ---- */
  function boot() {
    api('/api/admin/me').then(function (j) {
      if (j.ok) { $('whoami').textContent = j.username; show('panel'); pane('news'); loadNews(); }
      else show('login');
    }).catch(function () { show('login'); });
  }
  $('btnLogin').onclick = function () {
    api('/api/admin/login', { json: { username: $('loginUser').value.trim(), password: $('loginPass').value } })
      .then(function (j) {
        if (j.ok) { boot(); }
        else $('loginMsg').textContent = j.error === 'too_many_attempts' ? '尝试过多，请 15 分钟后再试' : '用户名或密码错误';
      })
      .catch(function () { $('loginMsg').textContent = '无法连接服务器'; });
  };
  $('loginPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btnLogin').click(); });
  $('btnLogout').onclick = function () { api('/api/admin/logout', { method: 'POST' }).then(function () { show('login'); }); };

  /* ---- tabs ---- */
  $('tabNews').onclick = function () { pane('news'); loadNews(); };
  $('tabEnq').onclick = function () { pane('enq'); loadEnquiries(); };

  /* ---- news list ---- */
  function loadNews() {
    api('/api/admin/news').then(function (j) {
      if (!j.ok) return;
      $('newsRows').innerHTML = j.items.map(function (n) {
        return '<tr><td>' + n.id + '</td>'
          + '<td>' + esc(n.title_zh || n.title_en) + '</td>'
          + '<td>' + esc(n.slug) + '</td>'
          + '<td>' + n.position + '</td>'
          + '<td><span class="tag ' + (n.status === 'published' ? 'pub">已发布' : 'draft">草稿') + '</span></td>'
          + '<td>' + esc(String(n.updated_at).replace('T', ' ').slice(0, 16)) + '</td>'
          + '<td><button class="btn ghost btn-sm" data-edit="' + n.id + '">编辑</button></td></tr>';
      }).join('');
      Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function (b) {
        b.onclick = function () { openEditor(Number(b.getAttribute('data-edit'))); };
      });
    });
  }

  /* ---- editor ---- */
  function openEditor(id) {
    editingId = id || null;
    $('editorMsg').textContent = '';
    $('btnDelete').classList.toggle('hidden', !editingId);
    $('editorTitle').textContent = editingId ? ('编辑 #' + editingId) : '新建新闻';
    FIELDS.forEach(function (f) { $('f_' + f).value = f === 'position' ? 0 : (f === 'status' ? 'draft' : ''); });
    if (editingId) {
      api('/api/admin/news/' + editingId).then(function (j) {
        if (!j.ok) return;
        FIELDS.forEach(function (f) { $('f_' + f).value = j.item[f] == null ? '' : j.item[f]; });
        pane('editor');
      });
    } else {
      pane('editor');
    }
  }
  $('btnNewArticle').onclick = function () { openEditor(null); };
  $('btnBackToList').onclick = function () { pane('news'); loadNews(); };

  $('btnSave').onclick = function () {
    var payload = {};
    FIELDS.forEach(function (f) { payload[f] = $('f_' + f).value; });
    var req = editingId
      ? api('/api/admin/news/' + editingId, { method: 'PUT', json: payload })
      : api('/api/admin/news', { json: payload });
    var m = $('editorMsg');
    req.then(function (j) {
      if (j.ok) {
        m.className = 'msg ok'; m.textContent = '已保存';
        if (!editingId && j.id) { editingId = j.id; $('btnDelete').classList.remove('hidden'); $('editorTitle').textContent = '编辑 #' + j.id; }
      } else {
        m.className = 'msg err';
        m.textContent = j.error === 'slug_exists' ? 'Slug 已存在，请换一个'
          : (j.error === 'slug_and_title_en_required' ? 'Slug 和英文标题为必填' : '保存失败：' + j.error);
      }
    }).catch(function () { m.className = 'msg err'; m.textContent = '无法连接服务器'; });
  };

  $('btnDelete').onclick = function () {
    if (!editingId || !window.confirm('确定删除这条新闻？此操作不可恢复。')) return;
    api('/api/admin/news/' + editingId, { method: 'DELETE' }).then(function (j) {
      if (j.ok) { pane('news'); loadNews(); }
    });
  };

  /* ---- enquiries ---- */
  function loadEnquiries() {
    api('/api/admin/enquiries').then(function (j) {
      if (!j.ok) return;
      $('enqRows').innerHTML = j.items.map(function (e) {
        var route = [e.origin, e.destination].filter(Boolean).join(' → ');
        var what = [route, e.service, e.reference].filter(Boolean).join('<br>');
        return '<tr><td>' + e.id + '</td>'
          + '<td>' + (e.kind === 'tracking' ? '追踪' : '询盘') + '</td>'
          + '<td>' + esc(e.name) + (e.company ? '<br><span class="hint">' + esc(e.company) + '</span>' : '') + '</td>'
          + '<td>' + esc(e.email) + (e.phone ? '<br><span class="hint">' + esc(e.phone) + '</span>' : '') + '</td>'
          + '<td>' + what + '</td>'
          + '<td><pre class="msgbody">' + esc(e.message || '') + '</pre></td>'
          + '<td>' + esc(e.lang) + '</td>'
          + '<td>' + (e.email_sent ? '✓' : '—') + '</td>'
          + '<td>' + esc(String(e.created_at).replace('T', ' ').slice(0, 16)) + '</td></tr>';
      }).join('');
    });
  }

  boot();
})();
</script>
</body>
</html>
